apiVersion: v1
kind: ConfigMap
metadata:
  name: foodee-config
data:
  # Local port-forwards are reachable by the browser. These are not public URLs.
  API_URL: http://localhost:3001
  FRONTEND_URL: http://localhost:3000
  ALLOWED_ORIGINS: http://localhost:3000
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: foodee
  DB_NAME: foodee
  DB_POOL_MAX: "10"
  DB_POOL_MIN: "2"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_BUCKET: foodee
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  AI_SERVER_URL: http://ai-server:8000
  FOOD_AI_URL: http://food-ai:5000
  JWT_EXPIRATION: 3600s
  LLM_PROVIDER: gemini
  AI_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
  FOOD_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
