apiVersion: v1
kind: Service
metadata:
  name: food-ai
spec:
  selector: {app: food-ai}
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ai
spec:
  replicas: 1
  selector:
    matchLabels: {app: food-ai}
  template:
    metadata:
      labels: {app: food-ai}
    spec:
      containers:
        - name: food-ai
          image: foodee/food-ai:poc
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef: {name: foodee-config}
          env:
            - {name: FOOD_UPLOAD_FOLDER, value: /app/runtime}
            - {name: FOOD_DETECTION_MODEL, value: models/detection/detection.pt}
            - {name: FOOD_CLASSIFIER_MODEL, value: models/classification/classifier_b2_finetuned_from_pth_float16.tflite}
            - {name: GUNICORN_BIND, value: "0.0.0.0:5000"}
            - {name: GUNICORN_WORKERS, value: "1"}
            - {name: GUNICORN_THREADS, value: "2"}
            - {name: GUNICORN_TIMEOUT, value: "120"}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 20
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
          volumeMounts:
            - {name: runtime, mountPath: /app/runtime}
      volumes:
        - name: runtime
          emptyDir: {}
