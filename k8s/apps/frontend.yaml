apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app: frontend}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: foodee/frontend:poc
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - {name: NODE_ENV, value: production}
            - {name: PORT, value: "3000"}
            - {name: HOSTNAME, value: "0.0.0.0"}
            - {name: INTERNAL_API_URL, value: "http://api:3001"}
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: MINIO_ENDPOINT}
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: MINIO_PORT}
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: MINIO_USE_SSL}
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: MINIO_BUCKET}
            - name: MINIO_PUBLIC_ENDPOINT
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: MINIO_PUBLIC_ENDPOINT}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: MINIO_SECRET_KEY}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
