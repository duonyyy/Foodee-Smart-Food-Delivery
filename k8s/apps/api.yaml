apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: foodee/backend:poc
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef: {name: foodee-config}
          env:
            - {name: NODE_ENV, value: development}
            - {name: PORT, value: "3001"}
            - {name: QUEUE_PROCESSOR_ENABLED, value: "false"}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: DB_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: JWT_SECRET}
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: AI_SERVICE_TOKEN}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: MINIO_ACCESS_KEY}
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: MINIO_SECRET_KEY}
            - name: MAPBOX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: MAPBOX_ACCESS_TOKEN}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
