apiVersion: v1
kind: Service
metadata:
  name: ai-server
spec:
  selector: {app: ai-server}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: ai-server}
  template:
    metadata:
      labels: {app: ai-server}
    spec:
      containers:
        - name: ai-server
          image: foodee/ai-server:poc
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: foodee-config}
          env:
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: AI_SERVICE_TOKEN}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: GEMINI_API_KEY}
          startupProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
