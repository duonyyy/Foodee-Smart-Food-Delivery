apiVersion: batch/v1
kind: Job
metadata:
  name: foodee-migrate
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h postgres -U foodee -d foodee; do sleep 2; done
      containers:
        - name: migrate
          image: foodee/backend:poc
          imagePullPolicy: Never
          command: [npm, run, migration:run:compiled]
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: DB_HOST}
            - name: DB_PORT
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: DB_PORT}
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: DB_USERNAME}
            - name: DB_NAME
              valueFrom:
                configMapKeyRef: {name: foodee-config, key: DB_NAME}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: foodee-secrets, key: DB_PASSWORD}
